# Source of truth for the Xcode project. The .xcodeproj is generated by
# `xcodegen` and is not committed, so pbxproj merge conflicts cannot happen.
# Regenerate with: xcodegen generate
name: Fathom
options:
  bundleIdPrefix: com.devshakib
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Trap 1: macOS silently refuses to register an unsandboxed widget
    # extension. It never reaches pluginkit, never reaches the gallery, and
    # emits no error. This is mandatory, not advisory.
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Trap 2: manual signing with no profile builds green and strips the
    # entitlements, which lands you back in trap 1 with nothing to read.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VKN4MYB5ZW
    SWIFT_STRICT_CONCURRENCY: minimal

# The document model and the renderer are compiled into both targets rather
# than shared through a framework. An embedded framework would have to be
# linked-not-embedded by the appex and found back up four levels of @rpath;
# that is a green build with a widget that fails to launch. Duplicated object
# code is cheaper than that class of bug.
targets:
  Fathom:
    type: application
    platform: macOS
    sources: [App, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devshakib.fathom
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    entitlements:
      path: App/Fathom.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Trap 3: a sandboxed extension's home directory IS its container, so
        # a home-relative exception can never reach the app's files. An App
        # Group is the only shared surface. Team-prefixed because Fathom is
        # distributed outside the App Store.
        com.apple.security.application-groups:
          - VKN4MYB5ZW.com.devshakib.fathom
        # The app fetches a user's JSON endpoint to show them its tree.
        com.apple.security.network.client: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT licensed. Free, every feature, forever."
    dependencies:
      - target: FathomWidget
        embed: true
        codeSign: true

  FathomWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Core]
    settings:
      base:
        # The embedded extension's bundle id must be prefixed with the host
        # app's full bundle id or ValidateEmbeddedBinary fails the build.
        PRODUCT_BUNDLE_IDENTIFIER: com.devshakib.fathom.widget
    entitlements:
      path: Widget/FathomWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - VKN4MYB5ZW.com.devshakib.fathom
        # A widget that renders live data has to be able to reach the network
        # itself; the host app is not running when the timeline reloads.
        com.apple.security.network.client: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# Source of truth for the Xcode project. The .xcodeproj is generated by
# `xcodegen` and is not committed, so pbxproj merge conflicts cannot happen.
# Regenerate with: xcodegen generate
name: Fathom
options:
  bundleIdPrefix: com.devshakib
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Trap 1: macOS silently refuses to register an unsandboxed widget
    # extension. It never reaches pluginkit, never reaches the gallery, and
    # emits no error. This is mandatory, not advisory.
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Trap 2: manual signing with no profile builds green and strips the
    # entitlements, which lands you back in trap 1 with nothing to read.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VKN4MYB5ZW
    SWIFT_STRICT_CONCURRENCY: minimal

# The document model and the renderer are compiled into both targets rather
# than shared through a framework. An embedded framework would have to be
# linked-not-embedded by the appex and found back up four levels of @rpath;
# that is a green build with a widget that fails to launch. Duplicated object
# code is cheaper than that class of bug.
targets:
  Fathom:
    type: application
    platform: macOS
    sources: [App, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devshakib.fathom
        # Generated by Tools/MakeIcon.swift; the .icns is a build product that
        # happens to be committed, and the script is the source of truth.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    entitlements:
      path: App/Fathom.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # NOT an App Group. A group is bound to the signing team and an
        # ad-hoc signature has no team, so an unsigned build's extension gets
        # a group URL it is then denied. Measured; see Core/Store/SharedStore.
        # An absolute-path exception is identity-independent and works under
        # both signatures.
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /Users/Shared/Fathom/
        # The app fetches a user's JSON endpoint to show them its tree.
        com.apple.security.network.client: true
        # Only used when a document adds a calendar or reminders source. The
        # entitlement makes the ask possible; it does not make it happen.
        com.apple.security.personal-information.calendars: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        CFBundleIconFile: Fathom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT licensed. Free, every feature, forever."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.devshakib.fathom.widget
            UTTypeDescription: Fathom Widget
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [fathom]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fathom Widget
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.devshakib.fathom.widget]
        NSCalendarsFullAccessUsageDescription: "Fathom shows your upcoming events on a widget you designed. Nothing leaves this Mac."
        NSRemindersFullAccessUsageDescription: "Fathom shows your due reminders on a widget you designed. Nothing leaves this Mac."
    dependencies:
      - target: FathomWidget
        embed: true
        codeSign: true

  FathomWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Core]
    settings:
      base:
        # The embedded extension's bundle id must be prefixed with the host
        # app's full bundle id or ValidateEmbeddedBinary fails the build.
        PRODUCT_BUNDLE_IDENTIFIER: com.devshakib.fathom.widget
    entitlements:
      path: Widget/FathomWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /Users/Shared/Fathom/
        # A widget that renders live data has to be able to reach the network
        # itself; the host app is not running when the timeline reloads.
        com.apple.security.network.client: true
        # The extension reads the calendar at reload time, so it needs the
        # entitlement too. Whether the app's permission grant reaches an
        # extension is a question to measure rather than assume.
        com.apple.security.personal-information.calendars: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSCalendarsFullAccessUsageDescription: "Fathom shows your upcoming events on a widget you designed. Nothing leaves this Mac."
        NSRemindersFullAccessUsageDescription: "Fathom shows your due reminders on a widget you designed. Nothing leaves this Mac."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  FathomTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles Core directly rather than importing it. Core is not a module —
    # it is source shared into the app and the extension — so the tests exercise
    # exactly the files those two ship, with no wrapper in between.
    sources: [Tests, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devshakib.fathom.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

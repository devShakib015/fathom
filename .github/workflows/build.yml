name: Build

# Manual by default. Tagging `v*` additionally publishes a release, so cutting
# one is a deliberate act rather than something a push does by accident.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Printed, not assumed. Fathom needs the macOS 26 SDK — FoundationModels
      # does not exist before it — so a runner without one fails here with a
      # readable reason rather than fifty lines into a compile.
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild test \
            -project Fathom.xcodeproj -scheme FathomTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || \
          xcodebuild test \
            -project Fathom.xcodeproj -scheme FathomTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # Built unsigned, then ad-hoc signed by the project's own script. That is
      # the shipping path exactly: Fathom has no Developer ID, and sign.sh reads
      # the signature back to prove the sandbox and the shared-store exception
      # survived it. SPEC.md §6 trap 8 is what happens when they do not.
      - name: Build
        run: |
          xcodebuild -project Fathom.xcodeproj -scheme Fathom \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign, and verify the entitlements survived
        run: ./Tools/sign.sh build/Build/Products/Release/Fathom.app

      # ditto, not zip: an .app is a bundle with symlinks and file modes that a
      # plain zip does not carry, and a bundle that arrives subtly broken is the
      # kind of thing nobody notices until it will not launch.
      - name: Package
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/Fathom.app Fathom.zip
          shasum -a 256 Fathom.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Fathom
          path: Fathom.zip

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Fathom.zip \
            --title "Fathom ${GITHUB_REF_NAME}" \
            --notes "Unsigned and ad-hoc signed. macOS will refuse it on first launch — open System Settings ▸ Privacy & Security and choose Open Anyway. See the README for why, and SPEC.md §6 trap 9 for why permissions reset on every update."
